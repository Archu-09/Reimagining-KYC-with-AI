<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel & OAuth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .loading { background: #fff3cd; border-color: #ffeaa7; }
        button { padding: 8px 16px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 KYC Admin Panel & OAuth Test</h1>
    
    <div class="test-section" id="admin-test">
        <h3>📊 Admin Panel API Test</h3>
        <button onclick="testAdminJobs()">Test Admin Jobs</button>
        <button onclick="testJobDetails()">Test Job Details</button>
        <div id="admin-results"></div>
    </div>
    
    <div class="test-section" id="oauth-test">
        <h3>🔑 OAuth Test</h3>
        <button onclick="testGoogleOAuth()">Test Google OAuth</button>
        <button onclick="testGitHubOAuth()">Test GitHub OAuth</button>
        <div id="oauth-results"></div>
    </div>
    
    <div class="test-section" id="navigation-test">
        <h3>🧭 Navigation Test</h3>
        <button onclick="testAdminNavigation()">Go to Admin Panel</button>
        <button onclick="testSignInNavigation()">Go to Sign In</button>
        <button onclick="testMainNavigation()">Go to Main KYC</button>
        <div id="nav-results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        
        function logResult(elementId, title, result, isError = false) {
            const element = document.getElementById(elementId);
            const className = isError ? 'error' : 'success';
            const timestamp = new Date().toLocaleTimeString();
            element.innerHTML = `
                <div class="${className}">
                    <strong>[${timestamp}] ${title}</strong>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                </div>
            `;
        }
        
        function logLoading(elementId, message) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="loading"><strong>⏳ ${message}</strong></div>`;
        }
        
        async function testAdminJobs() {
            logLoading('admin-results', 'Testing admin jobs endpoint...');
            try {
                const response = await fetch(`${API_BASE}/admin/jobs`);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                logResult('admin-results', 'Admin Jobs Success', {
                    status: response.status,
                    jobCount: data.length,
                    firstJob: data[0] || null
                });
            } catch (error) {
                logResult('admin-results', 'Admin Jobs Error', error.message, true);
            }
        }
        
        async function testJobDetails() {
            logLoading('admin-results', 'Testing job details endpoint...');
            try {
                const jobId = 'kyc_test_20251116_210010';
                const response = await fetch(`${API_BASE}/admin/jobs/${jobId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                logResult('admin-results', 'Job Details Success', {
                    status: response.status,
                    jobId: data.id,
                    jobStatus: data.status,
                    resultScore: data.result?.risk_assessment?.overall_score
                });
            } catch (error) {
                logResult('admin-results', 'Job Details Error', error.message, true);
            }
        }
        
        async function testGoogleOAuth() {
            logLoading('oauth-results', 'Testing Google OAuth mock login...');
            try {
                const response = await fetch(`${API_BASE}/auth/oauth/google/mock-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                
                // Test token storage
                localStorage.setItem('kyc_token', data.access_token);
                localStorage.setItem('kyc_user', JSON.stringify(data.user));
                
                logResult('oauth-results', 'Google OAuth Success', {
                    status: response.status,
                    user: data.user,
                    tokenStored: !!localStorage.getItem('kyc_token')
                });
            } catch (error) {
                logResult('oauth-results', 'Google OAuth Error', error.message, true);
            }
        }
        
        async function testGitHubOAuth() {
            logLoading('oauth-results', 'Testing GitHub OAuth mock login...');
            try {
                const response = await fetch(`${API_BASE}/auth/oauth/github/mock-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                
                // Test token storage
                localStorage.setItem('kyc_token', data.access_token);
                localStorage.setItem('kyc_user', JSON.stringify(data.user));
                
                logResult('oauth-results', 'GitHub OAuth Success', {
                    status: response.status,
                    user: data.user,
                    tokenStored: !!localStorage.getItem('kyc_token')
                });
            } catch (error) {
                logResult('oauth-results', 'GitHub OAuth Error', error.message, true);
            }
        }
        
        function testAdminNavigation() {
            logLoading('nav-results', 'Navigating to admin panel...');
            setTimeout(() => {
                window.location.href = 'http://localhost:3000/admin';
            }, 1000);
        }
        
        function testSignInNavigation() {
            logLoading('nav-results', 'Navigating to sign in...');
            setTimeout(() => {
                window.location.href = 'http://localhost:3000/signin';
            }, 1000);
        }
        
        function testMainNavigation() {
            logLoading('nav-results', 'Navigating to main KYC...');
            setTimeout(() => {
                window.location.href = 'http://localhost:3000/';
            }, 1000);
        }
        
        // Auto-run basic tests on page load
        window.onload = function() {
            console.log('🧪 Running automatic tests...');
            setTimeout(testAdminJobs, 500);
            setTimeout(testGoogleOAuth, 1500);
        };
    </script>
</body>
</html>
