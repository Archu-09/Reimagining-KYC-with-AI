<!DOCTYPE html>
<html>
<head>
    <title>KYC System Component Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .loading { background: #fff3cd; border-color: #ffeaa7; }
    </style>
</head>
<body>
    <h1>🧪 KYC System Component Test</h1>
    
    <div id="tests">
        <div class="test-section loading">
            <h3>🔄 Running Tests...</h3>
        </div>
    </div>

    <script>
        const tests = [
            { name: 'Main Landing Page', url: 'http://localhost:3000/', component: 'LandingPage' },
            { name: 'Dashboard', url: 'http://localhost:3000/dashboard', component: 'SimpleDashboard' },
            { name: 'Sign In', url: 'http://localhost:3000/signin', component: 'SimpleSignIn' },
            { name: 'Admin Panel', url: 'http://localhost:3000/admin', component: 'SimpleAdmin' },
            { name: 'KYC Verification', url: 'http://localhost:3000/verify', component: 'App' }
        ];

        const testContainer = document.getElementById('tests');
        testContainer.innerHTML = '';

        tests.forEach(test => {
            const div = document.createElement('div');
            div.className = 'test-section loading';
            div.innerHTML = `
                <h3>🔄 Testing ${test.name}</h3>
                <p><strong>URL:</strong> <a href="${test.url}" target="_blank">${test.url}</a></p>
                <p><strong>Component:</strong> ${test.component}</p>
                <div id="result-${test.name.replace(/\s+/g, '-')}">Loading...</div>
            `;
            testContainer.appendChild(div);

            // Test if the URL is accessible
            fetch(test.url)
                .then(response => {
                    const resultDiv = document.getElementById(`result-${test.name.replace(/\s+/g, '-')}`);
                    if (response.ok) {
                        div.className = 'test-section success';
                        resultDiv.innerHTML = '✅ Page accessible and loading correctly';
                    } else {
                        div.className = 'test-section error';
                        resultDiv.innerHTML = `❌ HTTP Error: ${response.status} ${response.statusText}`;
                    }
                })
                .catch(error => {
                    const resultDiv = document.getElementById(`result-${test.name.replace(/\s+/g, '-')}`);
                    div.className = 'test-section error';
                    resultDiv.innerHTML = `❌ Network Error: ${error.message}`;
                });
        });

        // Test backend APIs
        const apiDiv = document.createElement('div');
        apiDiv.className = 'test-section loading';
        apiDiv.innerHTML = `
            <h3>🔄 Testing Backend APIs</h3>
            <div id="api-results">Testing...</div>
        `;
        testContainer.appendChild(apiDiv);

        Promise.all([
            fetch('http://localhost:8000/api/admin/jobs').then(r => r.json()),
            fetch('http://localhost:8000/api/auth/oauth/google/mock-login', {method: 'POST'}).then(r => r.json())
        ])
        .then(([adminData, oauthData]) => {
            apiDiv.className = 'test-section success';
            document.getElementById('api-results').innerHTML = `
                ✅ Admin API: ${adminData.length} jobs available<br>
                ✅ OAuth API: ${oauthData.user?.name} login working
            `;
        })
        .catch(error => {
            apiDiv.className = 'test-section error';
            document.getElementById('api-results').innerHTML = `❌ API Error: ${error.message}`;
        });
    </script>
</body>
</html>
